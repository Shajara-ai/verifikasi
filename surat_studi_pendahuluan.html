<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Validasi Dokumen Akademik - FIKes Faletehan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1b5e20;
            --secondary-color: #2e7d32;
            --bg-color: #f0f4f1;
            --text-color: #263238;
            --border-color: #cfd8dc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 15px; }
        
        .container { max-width: 550px; background: white; margin: 15px auto; padding: 30px; border-radius: 16px; box-shadow: 0 12px 35px rgba(0,0,0,0.08); border-top: 10px solid var(--primary-color); position: relative; }
        
        /* Header Birokrasi Formal */
        .header-section { text-align: center; margin-bottom: 25px; border-bottom: 2px double var(--border-color); padding-bottom: 15px; }
        .logo-header { width: 85px; margin-bottom: 10px; }
        .header-section h3 { font-size: 16px; font-weight: 700; color: #111; letter-spacing: 0.5px; text-transform: uppercase; }
        .header-section p { color: #546e7a; font-size: 12px; font-weight: 500; }
        
        /* Badge Status */
        .status-container { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 25px; }
        .status-badge { background-color: #e8f5e9; color: var(--secondary-color); padding: 10px 24px; border-radius: 50px; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; border: 1px solid #a5d6a7; display: inline-flex; align-items: center; gap: 8px; }
