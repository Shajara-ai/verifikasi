<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Naskah Dinas - FIKes UF</title>
    <style>
        body { background: #fdfdfd; display: flex; justify-content: center; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
        .srikandi-container {
            background: white;
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .garuda-logo { width: 120px; margin-bottom: 10px; }
        .srikandi-logo { width: 180px; margin-bottom: 30px; }
        
        .title { font-weight: 800; font-size: 20px; line-height: 1.3; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .info-group { margin-bottom: 25px; text-align: left; padding: 0 10px; }
        .info-label { font-size: 14px; color: #666; margin-bottom: 5px; }
        .info-value { font-size: 16px; font-weight: bold; color: #111; word-wrap: break-word; }
        .info-value.hash { color: #c0392b; font-family: monospace; font-weight: normal; font-size: 13px; }

        .line { border-bottom: 1px solid #eee; margin: 20px 0; }
        .tte-info { font-size: 14px; color: #555; margin-bottom: 20px; font-style: italic; }

        /* Tombol Download Merah ala SRIKANDI */
        .btn-download {
            display: none;
            background: #e74c3c;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2);
            transition: 0.3s;
        }
        .btn-download:hover { background: #c0392b; transform: translateY(-2px); }
        .btn-download i { margin-right: 8px; }
    </style>
</head>
<body>

<div class="srikandi-container">
    <img src="files/logo-fikes.png" style="width: auto; height: 90px; margin-bottom: 10px;" alt="Logo FIKes UF">

    <div style="font-size: 20px; font-weight: 900; color: #27ae60; letter-spacing: 1px; margin-bottom: 5px;">FAKULTAS ILMU KESEHATAN</div>
    <div style="font-size: 16px; font-weight: 700; color: #333; margin-bottom: 30px;">UNIVERSITAS FALETEHAN</div>

    <div class="info-group">
        <div class="info-label">Nilai Hash :</div>
        <div class="info-value hash" id="hashDisplay">aed937f3a18c7c3c003635e83a541c18...</div>
    </div>

    <div class="tte-info">Naskah ini telah tertandatangani oleh :</div>

    <div class="line"></div>

    <div class="info-group">
        <div class="info-label">Nama :</div>
        <div class="info-value" id="namaDisplay">-</div>
    </div>

    <div class="info-group">
        <div class="info-label">Jabatan :</div>
        <div class="info-value" id="peranDisplay">-</div>
    </div>

    <div class="info-group">
        <div class="info-label">Unit Kerja :</div>
        <div class="info-value">Fakultas Ilmu Kesehatan (FIKes)</div>
    </div>

    <div class="info-group">
        <div class="info-label">Instansi :</div>
        <div class="info-value">Universitas Faletehan</div>
    </div>

    <div class="info-group">
        <div class="info-label">Ditandatangani pada :</div>
        <div class="info-value" id="tglDisplay">-</div>
    </div>

    <div class="line"></div>

    <a id="btnDownload" href="#" class="btn-download" target="_blank">
        📄 LIHAT FILE DIGITAL
    </a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const nama = urlParams.get('nama');
    const peran = urlParams.get('peran');
    const tgl = urlParams.get('tgl');
    const id = urlParams.get('id');

    if (nama) {
        const decodedNama = decodeURIComponent(nama);
        document.getElementById('namaDisplay').innerText = decodedNama;
        document.getElementById('peranDisplay').innerText = decodeURIComponent(peran || "Staff Akademik");
        document.getElementById('tglDisplay').innerText = decodeURIComponent(tgl || "-");
        
        // Buat Hash buatan agar terlihat resmi
        const fakeHash = btoa(decodedNama).toLowerCase().substring(0, 32);
        document.getElementById('hashDisplay').innerText = fakeHash;

        // Logika Tombol Download (Arahkan ke folder files/)
        const namaFilePDF = "Sertifikat_" + decodedNama.replace(/ /g, "_") + ".pdf";
        const linkKeFile = "https://shajara-ai.github.io/verifikasi/files/" + namaFilePDF;

        const btn = document.getElementById('btnDownload');
        if (btn) {
            btn.href = linkKeFile;
            btn.style.display = "inline-block";
        }
    } else {
        document.querySelector('.srikandi-container').innerHTML = "<h3>Data Tidak Ditemukan</h3>";
    }
</script>

</body>
</html>
